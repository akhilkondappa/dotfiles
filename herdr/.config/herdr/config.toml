# herdr configuration
onboarding = false

[theme]
name = "rose-pine"

[keys]
settings = "prefix+;"
reload_config = "prefix+r"
goto = "prefix+s"
new_workspace = "prefix+shift+w"
rename_workspace = "prefix+$"
rename_tab = "prefix+,"
split_vertical = "prefix+|"
zoom = "prefix+m"
resize_mode = "prefix+R"
navigate_workspace_up = "ctrl+k"
navigate_workspace_down = "ctrl+j"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[[keys.command]]
key = "prefix+O"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"
description = "Opens Lazygit"

[ui]
mouse_scroll_lines = 7
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false
