# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on
set -g focus-events on

set -g base-index 1
set-hook -g session-created "if -F '#{==:#{session_name},0}' 'rename-session default'"

# Pass AWS/k8s env to status bar scripts
set -g update-environment "AWS_PROFILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_CREDENTIAL_EXPIRATION AWS_DEFAULT_REGION KUBECONFIG"
set -g pane-base-index 1

set-option -g prefix C-a
set-option -g prefix2 none
bind C-a send-prefix

set -g detach-on-destroy off

# Utility bindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# resizing panes with hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# maximize panes
bind -r m resize-pane -Z

# disable kill accept prompt
bind x kill-pane

# close window (tab)
bind X kill-window

# move window left/right
bind < swap-window -t -1\; select-window -t -1
bind > swap-window -t +1\; select-window -t +1

# swap panes (select target)
bind S display-panes -d 0 "swap-pane -d -t '%%'"

# mouse support
set -g mouse on

# vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection

# Sesh keybinds
# sesh w/ gum dir selector
bind "T" display-popup -E -w 40% "sesh connect \"$(
    sesh list -i | gum filter --no-strip-ansi --limit 1 --placeholder 'Pick session' --prompt='🛸 '
)\""

# sesh w/ (tmux fzf)
bind "K" run-shell "sesh connect \"$(
        sesh list --icons | fzf-tmux -p 90%,80% \
        --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
        --header '🔑 ^a all | ^t tmux | ^g conf | ^x zoxide | ^r rename | ^d tmux kill | ^f find' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(🛸  )+reload(sesh list --icons)' \
        --bind 'ctrl-t:change-prompt(◧  )+reload(sesh list -t --icons)' \
        --bind 'ctrl-g:change-prompt(⛯  )+reload(sesh list -c --icons)' \
        --bind 'ctrl-x:change-prompt(🗃  )+reload(sesh list -z --icons)' \
        --bind 'ctrl-f:change-prompt(🔭  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
        --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(👽  )+reload(sesh list --icons)' \
        --preview-window 'right:45%' \
        --preview 'sesh preview {}'
)\""

# tmux goodies
bind -r f run-shell "tmux neww ~/scripts/tmux-sessionizer.sh"
bind n command-prompt "new-session -s '%%'"

# explicit window navigation (used by ghostty keybinds)
bind -n M-H previous-window
bind -n M-L next-window

# ghostty sends these via cmd+key shortcuts
bind < swap-window -t -1\; select-window -t -1
bind > swap-window -t +1\; select-window -t +1
bind s display-panes -d 0

# search (enters copy-mode with search prompt)
bind / copy-mode \; send-keys /

# tmux display popups
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi" # yazi float
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh" # quick floating terminal
bind C-g display-popup -d "#{pane-current-path}" -w 90% -h 90% -E "lazygit" # lazygit float
bind C-d display-popup -d "#{pane_current_path}" -w 80% -h 50% -E "source ~/.config/dock/dock.sh && dock menu" # dock menu
bind C-m display-popup -w 95% -h 95% -E "rmpc" # music float
bind d display-menu -T "#[align=centre]Config" -x C -y C \
    ".zshrc"            z  "display-popup -w 85% -h 85% -E 'nvim ~/.zsh/.zshrc'" \
    ".zprofile"         p  "display-popup -w 85% -h 85% -E 'nvim ~/.zsh/.zprofile'" \
    ".tmux.conf"        t  "display-popup -w 85% -h 85% -E 'nvim ~/.tmux.conf'" \
    ".nvim"             v  "display-popup -w 95% -h 95% -d "~/dotfiles/nvim/.config/nvim" -E 'nvim ~/dotfiles/nvim/.config/nvim'" \
    "quit"              q  ""

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# tmux plugin manager 
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin
set -g @plugin "christoomey/vim-tmux-navigator"
# Pass ctrl+h/j/k/l through to kiro-cli (and vim/fzf) instead of pane-switching
set -g @vim_navigator_pattern "(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf|kiro(-cli)?)(diff)?(-wrapped)?"
set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin 'catppuccin/tmux'


# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'    # save pane contents
set -g @resurrect-strategy-nvim 'session'        # restore nvim sessions
set -g @continuum-restore 'on'                   # auto-restore on tmux start
set -g @continuum-save-interval '15'             # auto-save every 15 min

set -g @sessionx-bind 'o'

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online status


# === Status bar: 2-line layout ===
# Line 0 (top): tmux windows, absolute centre
# Line 1 (bottom): session left, k8s/aws right

set -g status 2
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#{@thm_bg}"

# Line 0: windows centered, no left/right content
set -g status-left-length 0
set -g status-left ""
set -g status-right-length 0
set -g status-right ""
set -g status-justify "absolute-centre"

# Line 1: session on left, k8s + aws on right
set -g status-format[1] "#[align=left,bg=#{@thm_bg}]#{?client_prefix,#[fg=#{@thm_red},bold]  #S ,#[fg=#{@thm_green}]  #S }#[fg=#{@thm_yellow}]#{?window_zoomed_flag, 󰁌 zoom,}#[align=right,fg=#{@thm_teal}]#(~/scripts/tmux-k8s-status.sh) #[fg=#{@thm_peach}]#(~/scripts/tmux-aws-status.sh)"
# pane border look and feel
# setw -g pane-border-status top
# setw -g pane-border-format ""
# setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
# setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
# setw -g pane-border-lines single

# Strip kiro status icon when switching to a window (✓ or ⣿ → bare name)
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_overlay_1}"

set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"

# Auto-bootstrap TPM if missing (survives clean installs without re-running install.sh)
if "test ! -d ~/.config/tmux/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/.tmux/plugins/tpm && ~/.config/tmux/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/.tmux/plugins/tpm/tpm' # always keep this line last
